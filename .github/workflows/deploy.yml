
name: deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Deploy Docker image
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          docker rm -f lab11-prod 2>/dev/null || true

          docker run -d \
            --name lab11-prod \
            -p 8012:8000 \
            "$IMAGE:$TAG"

          docker ps
